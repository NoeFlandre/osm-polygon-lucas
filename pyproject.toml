[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-polygon-lucas"
version = "0.1.0"
description = "Read LUCAS 2022 Copernicus supports and measure class coverage of OSM polygons."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["shapely>=2.0,<3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.scripts]
lucas-cover = "osm_polygon_lucas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osm_polygon_lucas = ["lucas_2022_source.json"]

[dependency-groups]
dev = [
    "coverage",
    "hypothesis",
    "mutmut==3.8.0",
    "pytest",
    "radon",
    "ruff",
    "ty",
]
docs = ["mkdocs==1.6.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["tests"]
